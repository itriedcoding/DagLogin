name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: ui
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install --no-audit --no-fund }

      - name: Typecheck and build frontend
        working-directory: ui
        run: npm run build

      - name: Engine tests
        run: cargo test -p prism-core --all-targets

      - name: Check the desktop shell
        run: cargo check -p prism

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Build NSIS installer
        run: tauri build --bundles nsis

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # A cargo workspace puts the bundle under the repository root's target/,
          # not under src-tauri/. Fall back to the old location just in case.
          $nsis = Join-Path $PWD "target/release/bundle/nsis"
          if (-not (Test-Path $nsis)) { $nsis = Join-Path $PWD "src-tauri/target/release/bundle/nsis" }
          Write-Host "Bundles: $nsis"
          Copy-Item (Join-Path $nsis "*.exe") artifacts/
          $exe = Get-ChildItem artifacts/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii artifacts/SHA256SUMS.txt
          Get-ChildItem artifacts | Format-Table Name, Length
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-windows-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Prism ${{ github.ref_name }}
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
